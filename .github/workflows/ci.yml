name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests never touch the network: OCR comes from fixtures, translation
      # endpoints are stubbed, and any other request fails the test.
      - run: npm test
      - run: npm run build
